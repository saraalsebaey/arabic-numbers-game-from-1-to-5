<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هيا نتعلم الأرقام! 🎈</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF9A9E;
            --secondary: #FECFEF;
            --success: #A1C4FD;
            --warning: #FBC2EB;
            --text-dark: #4A4A4A;
            --bg-color: #FDFAF6;
            --btn-hover: #FF858A;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        #game-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-sizing: border-box;
            border: 5px dashed var(--secondary);
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 15px;
            margin-top: 0;
        }

        h2 { 
            color: var(--text-dark);
            font-size: 1.8rem;
            margin-top: 0;
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 1.3rem;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            width: 90%;
            max-width: 300px;
        }

        .btn:hover, .btn:active {
            transform: scale(1.05);
            background-color: var(--btn-hover);
        }

        .btn-option {
            background-color: var(--success);
            font-size: 2.2rem;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(161, 196, 253, 0.4);
            margin: 5px;
            padding: 0;
        }

        .btn-option:hover, .btn-option:active {
            background-color: #8AB3FC;
        }

        .big-number {
            font-size: 6rem;
            color: var(--primary);
            font-weight: 800;
            margin: 10px 0;
            line-height: 1;
        }

        .items-container {
            font-size: 3rem;
            margin: 15px 0;
            min-height: 70px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        /* تنسيقات نشاط البالونات */
        .balloons-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            min-height: 90px;
        }

        .balloon-btn {
            font-size: 3.5rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            padding: 0;
            margin: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .balloon-btn:active {
            transform: scale(0.9);
        }

        .popped {
            animation: popEffect 0.3s forwards;
            pointer-events: none;
        }

        .feedback {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 15px 0;
            min-height: 35px;
        }

        .feedback.success { color: #4CAF50; animation: bounce 0.5s; }
        .feedback.error { color: #FF5252; animation: shake 0.5s; }

        .hidden { display: none !important; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            25% {transform: translateX(-5px);}
            75% {transform: translateX(5px);}
        }
        @keyframes popEffect {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .navigation-btns { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }

        /* --- تحسينات الموبايل (Responsive Design) --- */
        @media (max-width: 480px) {
            #game-container {
                padding: 20px 15px;
                border-width: 3px;
            }
            h1 { font-size: 2rem; }
            h2 { font-size: 1.5rem; }
            p { font-size: 1.1rem; }
            .big-number { font-size: 5rem; }
            .btn { font-size: 1.2rem; padding: 12px 20px; }
            .btn-option { width: 65px; height: 65px; font-size: 1.8rem; margin: 3px; }
            .items-container { font-size: 2.5rem; }
            .balloon-btn { font-size: 3rem; }
            .feedback { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- شاشة البداية -->
        <div id="start-screen" class="screen active">
            <h1>هيا نتعلم الأرقام! 🎈</h1>
            <p style="color: #666;">أهلاً بك يا بطل! هل أنت مستعد لتعلم الأرقام من ١ إلى ٥؟</p>
            <div class="navigation-btns">
                <button class="btn" onclick="startGame()">ابدأ اللعب 🚀</button>
            </div>
        </div>

        <!-- النشاط الأول: تعرف على الرقم -->
        <div id="activity1-screen" class="screen">
            <h2>١. تعرّف على الرقم</h2>
            <div id="a1-number" class="big-number">١</div>
            <div id="a1-items" class="items-container">🍎</div>
            <div class="navigation-btns">
                <button class="btn" onclick="nextA1()">الرقم التالي ➡️</button>
                <button class="btn hidden" id="btn-to-a2" onclick="showScreen('activity2-screen'); initActivity2();">النشاط التالي 🌟</button>
            </div>
        </div>

        <!-- النشاط الثاني: اختر الرقم الصحيح -->
        <div id="activity2-screen" class="screen">
            <h2>٢. اختر الرقم الصحيح</h2>
            <p>كم نجمة في الصورة؟</p>
            <div id="a2-items" class="items-container"></div>
            <div id="a2-options" style="display: flex; justify-content: center; gap: 10px;"></div>
            <div id="a2-feedback" class="feedback"></div>
            <div class="navigation-btns">
                <button class="btn hidden" id="a2-next-btn" onclick="nextA2()">السؤال التالي ➡️</button>
                <button class="btn hidden" id="btn-to-a3" onclick="showScreen('activity3-screen'); initActivity3();">النشاط التالي 🌟</button>
            </div>
        </div>

        <!-- النشاط الثالث: عد الأشياء -->
        <div id="activity3-screen" class="screen">
            <h2>٣. عدّ الأشياء</h2>
            <p>عدّ الكرات واضغط على الرقم الصحيح:</p>
            <div id="a3-items" class="items-container"></div>
            <div id="a3-options" style="display: flex; justify-content: center; gap: 10px;"></div>
            <div id="a3-feedback" class="feedback"></div>
            <div class="navigation-btns">
                <button class="btn hidden" id="a3-next-btn" onclick="nextA3()">السؤال التالي ➡️</button>
                <button class="btn hidden" id="btn-to-a4" onclick="showScreen('activity4-screen'); initActivity4();">النشاط التالي 🌟</button>
            </div>
        </div>

        <!-- النشاط الرابع: فرقع البالونات (الجديد) -->
        <div id="activity4-screen" class="screen">
            <h2>٤. فرقع البالونات 🎈</h2>
            <p id="a4-instruction" style="font-weight: bold; color: var(--primary);"></p>
            <div id="a4-balloons-container" class="balloons-area"></div>
            <div id="a4-feedback" class="feedback"></div>
            <div class="navigation-btns">
                <button class="btn hidden" id="a4-next-btn" onclick="nextA4()">السؤال التالي ➡️</button>
                <button class="btn hidden" id="btn-finish" onclick="showScreen('end-screen')">إنهاء اللعبة 🏆</button>
            </div>
        </div>

        <!-- شاشة النهاية -->
        <div id="end-screen" class="screen">
            <h1>أنت بطل رائع! 🏆</h1>
            <p>لقد تعلمت الأرقام بنجاح!</p>
            <div style="font-size: 3.5rem; margin: 15px 0;">🎉🎈⭐</div>
            <div class="navigation-btns">
                <button class="btn" onclick="resetGame()">العب مرة أخرى 🔄</button>
            </div>
        </div>
    </div>

    <!-- المؤثرات الصوتية -->
    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const arabicNumbers = { 1: '١', 2: '٢', 3: '٣', 4: '٤', 5: '٥' };
        const emojis = ['🍎', '🚗', '⭐', '🎈', '🦋'];
        const balls = '⚽';

        let currentNumberA1 = 1;
        let currentQuestionA2 = 0;
        let currentQuestionA3 = 0;
        let currentQuestionA4 = 0;
        
        let questionsA2 = [];
        let questionsA3 = [];
        let questionsA4 = [];
        
        let a4Target = 0;
        let a4PoppedCount = 0;

        function playSuccessSound() {
            let sound = document.getElementById('success-sound');
            sound.currentTime = 0;
            sound.play().catch(e => console.log("الصوت يحتاج لتفاعل المستخدم أولاً"));
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            currentNumberA1 = 1;
            showScreen('activity1-screen');
            updateA1();
        }

        // --- النشاط الأول ---
        function updateA1() {
            document.getElementById('a1-number').innerText = arabicNumbers[currentNumberA1];
            
            // توزيع العناصر بشكل أفضل على الموبايل بدلاً من التكرار النصي البسيط
            let itemsHTML = '';
            for(let i=0; i<currentNumberA1; i++) {
                itemsHTML += `<span>${emojis[0]}</span>`;
            }
            document.getElementById('a1-items').innerHTML = itemsHTML;
            
            if (currentNumberA1 === 5) {
                document.querySelector('#activity1-screen .btn[onclick="nextA1()"]').classList.add('hidden');
                document.getElementById('btn-to-a2').classList.remove('hidden');
            } else {
                document.querySelector('#activity1-screen .btn[onclick="nextA1()"]').classList.remove('hidden');
                document.getElementById('btn-to-a2').classList.add('hidden');
            }
        }

        function nextA1() {
            if (currentNumberA1 < 5) {
                currentNumberA1++;
                updateA1();
            }
        }

        // --- دوال مساعدة ---
        function generateQuestions() {
            let nums = [1, 2, 3, 4, 5];
            return nums.sort(() => Math.random() - 0.5); 
        }

        function generateOptions(correctAnswer) {
            let options = [correctAnswer];
            while(options.length < 3) {
                let r = Math.floor(Math.random() * 5) + 1;
                if(options.indexOf(r) === -1) options.push(r);
            }
            return options.sort(() => Math.random() - 0.5);
        }

        // --- النشاط الثاني ---
        function initActivity2() {
            questionsA2 = generateQuestions();
            currentQuestionA2 = 0;
            loadQuestionA2();
        }

        function loadQuestionA2() {
            let correctNum = questionsA2[currentQuestionA2];
            let itemsHTML = '';
            for(let i=0; i<correctNum; i++) itemsHTML += `<span>⭐</span>`;
            document.getElementById('a2-items').innerHTML = itemsHTML;
            
            let optionsDiv = document.getElementById('a2-options');
            optionsDiv.innerHTML = '';
            
            let options = generateOptions(correctNum);
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = arabicNumbers[opt];
                btn.onclick = () => checkAnswerA2(opt, correctNum);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('a2-feedback').className = 'feedback';
            document.getElementById('a2-feedback').innerText = '';
            document.getElementById('a2-next-btn').classList.add('hidden');
            document.getElementById('btn-to-a3').classList.add('hidden');
        }

        function checkAnswerA2(selected, correct) {
            let feedback = document.getElementById('a2-feedback');
            if (selected === correct) {
                feedback.innerText = 'أحسنت! ⭐';
                feedback.className = 'feedback success';
                playSuccessSound();
                disableOptions('a2-options');
                
                if (currentQuestionA2 < 4) {
                    document.getElementById('a2-next-btn').classList.remove('hidden');
                } else {
                    document.getElementById('btn-to-a3').classList.remove('hidden');
                }
            } else {
                feedback.innerText = 'حاول مرة أخرى! 💪';
                feedback.className = 'feedback error';
            }
        }

        function nextA2() {
            currentQuestionA2++;
            loadQuestionA2();
        }

        // --- النشاط الثالث ---
        function initActivity3() {
            questionsA3 = generateQuestions();
            currentQuestionA3 = 0;
            loadQuestionA3();
        }

        function loadQuestionA3() {
            let correctNum = questionsA3[currentQuestionA3];
            let itemsHTML = '';
            for(let i=0; i<correctNum; i++) itemsHTML += `<span>${balls}</span>`;
            document.getElementById('a3-items').innerHTML = itemsHTML;
            
            let optionsDiv = document.getElementById('a3-options');
            optionsDiv.innerHTML = '';
            
            let options = generateOptions(correctNum); 
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = arabicNumbers[opt];
                btn.onclick = () => checkAnswerA3(opt, correctNum);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('a3-feedback').className = 'feedback';
            document.getElementById('a3-feedback').innerText = '';
            document.getElementById('a3-next-btn').classList.add('hidden');
            document.getElementById('btn-to-a4').classList.add('hidden');
        }

        function checkAnswerA3(selected, correct) {
            let feedback = document.getElementById('a3-feedback');
            if (selected === correct) {
                feedback.innerText = 'رائع جداً! ⭐';
                feedback.className = 'feedback success';
                playSuccessSound();
                disableOptions('a3-options');
                
                if (currentQuestionA3 < 4) {
                    document.getElementById('a3-next-btn').classList.remove('hidden');
                } else {
                    document.getElementById('btn-to-a4').classList.remove('hidden'); 
                }
            } else {
                feedback.innerText = 'أنت تستطيع، حاول مجدداً!';
                feedback.className = 'feedback error';
            }
        }

        function nextA3() {
            currentQuestionA3++;
            loadQuestionA3();
        }

        // --- النشاط الرابع (البالونات) ---
        function initActivity4() {
            questionsA4 = generateQuestions();
            currentQuestionA4 = 0;
            loadQuestionA4();
        }

        function loadQuestionA4() {
            a4Target = questionsA4[currentQuestionA4];
            a4PoppedCount = 0;
            
            let instructionText = `اضغط لتفرقع ${arabicNumbers[a4Target]} بالونات!`;
            document.getElementById('a4-instruction').innerText = instructionText;
            
            let container = document.getElementById('a4-balloons-container');
            container.innerHTML = '';
            
            for(let i = 0; i < 5; i++) {
                let b = document.createElement('button');
                b.className = 'balloon-btn';
                b.innerText = '🎈';
                b.onclick = function() { popBalloon(this); };
                container.appendChild(b);
            }
            
            document.getElementById('a4-feedback').className = 'feedback';
            document.getElementById('a4-feedback').innerText = '';
            document.getElementById('a4-next-btn').classList.add('hidden');
            document.getElementById('btn-finish').classList.add('hidden');
        }

        function popBalloon(btn) {
            if (btn.classList.contains('popped') || a4PoppedCount >= a4Target) return;
            
            btn.innerText = '💥';
            btn.classList.add('popped');
            a4PoppedCount++;
            
            if (a4PoppedCount === a4Target) {
                let feedback = document.getElementById('a4-feedback');
                feedback.innerText = 'أحسنت! أحلى بالونات! 🎈';
                feedback.className = 'feedback success';
                playSuccessSound();
                
                if (currentQuestionA4 < 4) {
                    document.getElementById('a4-next-btn').classList.remove('hidden');
                } else {
                    document.getElementById('btn-finish').classList.remove('hidden');
                }
            }
        }

        function nextA4() {
            currentQuestionA4++;
            loadQuestionA4();
        }

        // --- دوال عامة ---
        function disableOptions(containerId) {
            let btns = document.getElementById(containerId).getElementsByTagName('button');
            for(let btn of btns) {
                btn.disabled = true;
                btn.style.opacity = '0.7';
                btn.style.cursor = 'default';
            }
        }

        function resetGame() {
            showScreen('start-screen');
        }
    </script>
</body>
</html>
